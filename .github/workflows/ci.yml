name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        # PySide6 links these even when running headless under the offscreen
        # platform plugin; without them `import PySide6.QtWidgets` fails.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --python ${{ matrix.python }} pytest -q
