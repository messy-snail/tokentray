[project]
name = "tokentray"
version = "0.1.0"
description = "Cross-platform system-tray monitor for Claude Code and OpenAI Codex quota, with pretty desktop alerts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hskang" }]
keywords = ["claude-code", "openai-codex", "usage-monitoring", "system-tray", "quota"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.28",
    "typer>=0.15",
    "keyring>=25",
    "platformdirs>=4.3",
    "tomli-w>=1.0",
    "pyside6>=6.8",
]

[project.urls]
Homepage = "https://github.com/messy-snail/tokentray"
Issues = "https://github.com/messy-snail/tokentray/issues"

[project.scripts]
tokentray = "tokentray.cli:main"

[project.gui-scripts]
tokentray-gui = "tokentray.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokentray"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
