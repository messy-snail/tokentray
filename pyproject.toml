[project]
name = "tokentray"
dynamic = ["version"]
description = "Cross-platform system-tray monitor for Claude Code and OpenAI Codex quota, with pretty desktop alerts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hskang" }]
keywords = ["claude-code", "openai-codex", "usage-monitoring", "system-tray", "quota"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13",
    "keyring>=25",
    "platformdirs>=4.3",
    "tomli-w>=1.0",
    "pyside6>=6.8",
]

[project.urls]
Homepage = "https://github.com/messy-snail/tokentray"
Issues = "https://github.com/messy-snail/tokentray/issues"

[project.scripts]
tokentray = "tokentray.cli:main"

[project.gui-scripts]
tokentray-gui = "tokentray.app:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "ruff>=0.16",
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One version string for the wheel, the CLI and the macOS bundle.
path = "src/tokentray/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tokentray"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow: correctness (F), the pycodestyle errors that matter (E,
# W), import order (I) and the bugbear checks (B). Modernisation rules such as
# UP are left out - they would rewrite working code without changing what it
# does, and a mechanical diff is the last thing a first release needs.
select = ["E", "F", "W", "I", "B"]
# zip(strict=...) is a per-call-site judgement, not a defect.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Translation tables: one string per line reads better than a reflowed one, and
# key/placeholder parity is asserted by tests rather than by eye.
"src/tokentray/core/i18n.py" = ["E501"]
"src/tokentray/core/connection_strings.py" = ["E501"]
# A manual harness, never collected. Its closures deliberately capture a widget
# built later in the same iteration; untangling that is 0.1.1 work.
"tests/manual_connection_ui.py" = ["B023"]
